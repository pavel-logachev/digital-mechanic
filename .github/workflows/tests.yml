# Проверки на каждый push и pull request: правила приоритета, проверка цифр и ссылок, заявка, контракт API,
# синтаксис интерфейса. Тесты не ходят в LLM и не требуют руководств: поиск подменяется маленьким индексом из тестов.
name: tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --check web/app.js && node --check web/i18n.js
